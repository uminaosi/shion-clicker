<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>クッキークリッカー風ゲーム</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ダミーのWindows95風タイトルバー */
  #titlebar {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: calc(26px + env(safe-area-inset-top)); /* iOSのノッチ/ステータスバー分 */
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #ffffff;
    font-family: "MS Sans Serif", "Tahoma", "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: bold;
    padding: 3px 4px;
    padding-bottom: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    z-index: 10;
  }
  #titlebar .tb-buttons {
    display: flex;
  }
  .tb-btn {
    width: 18px;
    height: 16px;
    margin-left: 2px;
    background: #c0c0c0;
    color: #000000;
    border: 1px solid #000000;
    box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    font-size: 10px;
    font-weight: bold;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    padding: 0;
  }
  .tb-btn:active {
    box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh; /* モバイルのツールバー変動に対応（iOS/Android） */
    padding-top: calc(26px + env(safe-area-inset-top)); /* タイトルバー分 */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #C8C8C8;
    font-family: "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;      /* iOSのゴムバンドスクロール/Androidのpull-to-refresh防止 */
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;     /* ダブルタップズームとタップ遅延を排除 */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  #nojs {
    max-width: 460px;
    margin: 0 0 12px;
    padding: 8px 12px;
    background: #c0c0c0;
    border: 1px solid #000000;
    box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    font-size: 13px;
    color: #000000;
  }
  /* 数値表示：ボタンの少し上（クッキーアイコン付き） */
  .counter-row {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
  }
  #cookie-icon {
    width: 44px;
    height: 44px;
    margin-right: 12px; /* gap非対応の旧ブラウザでも離间隔を保つ */
    object-fit: contain;
    user-select: none;
    -webkit-user-select: none;
  }
  #counter {
    color: #000000;
    font-size: 2.6rem;
    font-weight: 700;
    user-select: none;
    transition: transform .08s ease;
  }
  #counter.bump { transform: scale(1.15); }

  #click-button {
    width: 260px;
    height: 260px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: transform .08s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; /* 連打可能（タップ遅延・ダブルタップズームなし） */
    -webkit-touch-callout: none;
  }
  #click-button img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #click-button:hover { transform: scale(1.04); }
  #click-button:active { transform: scale(0.92); }

  /* 買った手： concentric な環に等間隔で敷き詰め、1秒に1回クリック */
  #click-area { position: relative; }
  #hands-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0; /* inset非対応の旧ブラウザ対応 */
    pointer-events: none;
    transform: scale(var(--fit, 1));
  }
  .hand-orbit {
    position: absolute;
    animation: orbit 12s linear infinite reverse;
    pointer-events: none;
  }
  .hand {
    position: absolute;
    width: 56px;
    height: 56px;
    /* 手画像は常にクリックボタンの中心を向く */
    transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
  }
  .hand img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes orbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .hand.tap { animation: tap .25s ease-out; }
  @keyframes tap {
    0%   { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
    40%  { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.7); }
    100% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
  }

  /* ショップ（Windows95風ボタン） */
  #shop-row {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #buy-hand {
    background: #c0c0c0;
    color: #000000;
    border: 1px solid #000000;
    box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #404040;
    padding: 8px 14px;
    min-height: 44px; /* モバイルの推奨タップサイズ */
    font-family: "MS Sans Serif", "Tahoma", "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #buy-hand:active {
    box-shadow: inset -1px -1px 0 #ffffff, inset 1px 1px 0 #404040;
  }
  #buy-hand:disabled { color: #707070; cursor: default; }
  #hand-count { font-size: 13px; color: #000000; margin-top: 6px; user-select: none; -webkit-user-select: none; }

  /* クリック時に +1 が浮かび上がる演出 */
  .float {
    position: absolute;
    color: #000000;
    font-size: 1.4rem;
    font-weight: 700;
    pointer-events: none;
    animation: rise .6s ease-out forwards;
  }
  @keyframes rise {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-60px); }
  }
</style>
</head>

    <span>シオン.EXE</span>
    <div class="tb-buttons">
      <span class="tb-btn">_</span>
      <span class="tb-btn">□</span>
      <span class="tb-btn">✕</span>
    </div>
  </div>

/+n+n9it/+n+n9iu//7e//Q8+/+Q0v9nx34wqNDAWbvocD56h44S3O/P4Y8HVda2Dh7HNH5tsYzZoZPcAeJBiqQJK233mWGAE7oYvGn+6E6kIlNINJNOoh+GtvNzEf5TOQ7f0jgNcYrYujMt//+hwUxXFcKVH0fFt//4VIO4dkKY80NyP/1Hfjvs9k+P3rYqL4Pzm4qL4Pzm4qL4Pzm4Fj1Z5/muWfJP0lhcJw3xEc+jGnF39wz7Rl/Ej9nwLEqG/413tHQj1s/Cmbj/ugHD7id+tkj1slZRJdQMNveTl4D4nHVJ7TDrmGj50JSZK+Vrb9OrKhjE9g7+Jeptb/o9777dN4voUTMZOrCvzodHcunoqtjeNubGQLxi7afNDehr3vlUc+wrAv59D3RieQj4FGMNGtej0sZZNvpMjKZB8DS0+ds5ywz2kxrP8hpshS/EeWqpX5pyYGxri29HI8qfC6sC1IxcGD0btu/x0HXO7SWEUG8e73pcyiiNTtIjefKjbSUT//4VJZBTChD//gjrnZCmnpf//52m/+6Cf9f93/+cIH8Tv2Ll93Cn/+cIH8Tv2Ll93Cn/+cIH8Tv2Ll93Cn/+cIH8Tv2Ll927aMcdqRkQgLT/8KkhgKcCMf//wqQUcMiEAAA='
    };

    // WebP非対応ブラウザ（旧iOS等）では絵文字にフォールバック
    function embed(img, emoji, size) {
      img.addEventListener('error', () => {
        img.style.display = 'none';
        const s = document.createElement('span');
        s.textContent = emoji;
        s.style.fontSize = size + 'px';
        s.style.lineHeight = '1';
        if (img.parentNode) img.parentNode.appendChild(s);
        else document.body.appendChild(s);
      });
    }
    const button = document.getElementById('click-button');
    const buttonImg = document.getElementById('button-img');
    const counter = document.getElementById('counter');
    const cookieIcon = document.getElementById('cookie-icon');
    cookieIcon.src = IMG.cookie;
    embed(cookieIcon, '🍪', 44);
    buttonImg.src = IMG.character;
    embed(buttonImg, '🧑', 220);

    document.getElementById('nojs').style.display = 'none';
    let count = 0;

    // 2枚目の画像を事前読み込みして切り替え時のチラつきを防ぐ
    const alternateImg = new Image();
    alternateImg.src = IMG.character2;

    let revertTimer = null;

    button.addEventListener('click', (e) => {
      count += 1;
      counter.textContent = count.toLocaleString('ja-JP');

      // クリック中だけ一瞬もう一枚の画像にする
      if (revertTimer) clearTimeout(revertTimer);
      buttonImg.src = IMG.character2;
      revertTimer = setTimeout(() => {
        buttonImg.src = IMG.character;
        revertTimer = null;
      }, 150);

      // 数値を少し拡大して跳ねさせる
      counter.classList.remove('bump');
      void counter.offsetWidth; // アニメーション再開始のためreflow
      counter.classList.add('bump');

      // クリック位置から +1 を浮かせる
      const f = document.createElement('div');
      f.className = 'float';
      f.textContent = '+1';
      f.style.left = (e.clientX - 10) + 'px';
      f.style.top  = (e.clientY - 20) + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 600);

      updateBuyState();
    });

    // ショップ：100ゴールドで手を買う
    const clickArea = document.getElementById('click-area');
    const handsLayer = document.getElementById('hands-layer');
    const titlebar = document.getElementById('titlebar');
    const buyBtn = document.getElementById('buy-hand');
    const handCountEl = document.getElementById('hand-count');
    let hands = 0;

    const handImg = new Image();
    handImg.src = IMG.hand;

    // 環の規則：1周目=8個、2周目=10個、3周目=12個…1周増えるごとに+2（上限なし）
    const HAND_R = 28;    // 手画像半边（56px/2）
    const GAP = 6;        // 画像と1周目の隙間
    const R_STEP = 48;    // 環同士の間隔（ぎっしり詰める）

    // クリックボタンの中心（hands-layerの座標系＝click-areaの座標系）
    function buttonCenter() {
      const a = clickArea.getBoundingClientRect();
      const b = button.getBoundingClientRect();
      return {
        x: b.left - a.left + b.width / 2,
        y: b.top - a.top + b.height / 2,
        r: b.width / 2 + HAND_R + GAP   // ボタンのサイズに追従する1周目の半径
      };
    }

    function ringCapacity(n) { return 8 + 2 * (n - 1); }
    function ringRadius(n, base) { return base + (n - 1) * R_STEP; }
    function ringIndexOf(k) {
      let total = 0, n = 1;
      while (k > total + ringCapacity(n)) { total += ringCapacity(n); n += 1; }
      return n;
    }

    function updateBuyState() {
      buyBtn.disabled = count < 100;
    }

    // 一番外の環が画面に収まる縮小率（無限に増やしても全て表示される）
    function fitHandsLayer(lastRing, c) {
      handsLayer.style.transformOrigin = `${c.x}px ${c.y}px`;
      if (lastRing < 1) { handsLayer.style.setProperty('--fit', 1); return; }
      const avail = Math.max(90, Math.min(innerWidth, innerHeight - titlebar.offsetHeight) / 2 - 8);
      const scale = Math.max(0.2, Math.min(1, avail / ringRadius(lastRing, c.r)));
      handsLayer.style.setProperty('--fit', scale.toFixed(3));
    }

    function buildHands() {
      handsLayer.replaceChildren();
      const c = buttonCenter();
      let remaining = hands;
      let n = 1;
      while (remaining > 0) {
        const cap = ringCapacity(n);
        const r = ringRadius(n, c.r);

        // 回転の中心＝クリックボタンの中心になる正方形のコンテナ
        const orbit = document.createElement('div');
        orbit.className = 'hand-orbit';
        orbit.style.left = (c.x - r) + 'px';
        orbit.style.top = (c.y - r) + 'px';
        orbit.style.width = (r * 2) + 'px';
        orbit.style.height = (r * 2) + 'px';
        // 位相を絶対時間（ページ開始からの経過秒）基準にする。
        // 再構築しても周目の角度が飛びならない
        const phase = (performance.now() / 1000) % 12 + (n - 1) * 1.5;
        orbit.style.animationDelay = -phase + 's';

        const inRing = Math.min(remaining, cap);
        for (let i = 0; i < inRing; i++) {
          // 等間隔配置。偶数周は半ステップずらして隣接環の隙間に嵌める
          const deg = 90 + (i / cap) * 360 + (n % 2 === 0 ? 180 / cap : 0);
          const rad = deg * Math.PI / 180;

          const handEl = document.createElement('div');
          handEl.className = 'hand';
          handEl.style.left = (r + r * Math.cos(rad)) + 'px';
          handEl.style.top = (r - r * Math.sin(rad)) + 'px';
          // 手画像の角度＝クリックボタン中心から見た実際の位置角度に追従
          // CSSの rotate(+角度)は「時計回り」なので、中心方向は (90 − 位置角度) で表す
          // （以前は符号が逆で、手が中心から離れる方向＝バラバラの方向を向いていた）
          // 反時計回りに45度回転
          handEl.style.setProperty('--rot', (90 - deg - 45) + 'deg');

          const img = document.createElement('img');
          img.src = IMG.hand;
          img.alt = '手';
          embed(img, '✋', 44);
          handEl.appendChild(img);

          orbit.appendChild(handEl);
        }
        handsLayer.appendChild(orbit);

        remaining -= inRing;
        n += 1;
      }
      fitHandsLayer(ringIndexOf(Math.max(hands, 1)), c);
    }

    buyBtn.addEventListener('click', () => {
      if (count < 100) return;
      count -= 100;
      counter.textContent = count.toLocaleString('ja-JP');
      hands += 1;
      buildHands();

      handCountEl.textContent = '手: ' + hands.toLocaleString('ja-JP');
      updateBuyState();
    });

    // ボタン中心の位置が変わったら環も追従する
    window.addEventListener('resize', buildHands);

    // 1秒に1回、各手がクリック画像をタップして+1稼ぐ
    setInterval(() => {
      if (hands === 0) return;
      count += hands;
      counter.textContent = count.toLocaleString('ja-JP');

      counter.classList.remove('bump');
      void counter.offsetWidth;
      counter.classList.add('bump');

      document.querySelectorAll('.hand').forEach(h => {
        h.classList.remove('tap');
        void h.offsetWidth;
        h.classList.add('tap');
      });

      const r = button.getBoundingClientRect();
      const f = document.createElement('div');
      f.className = 'float';
      f.textContent = '+' + hands.toLocaleString('ja-JP');
      f.style.left = (r.left + r.width / 2 - 14) + 'px';
      f.style.top  = (r.top - 12) + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 600);

      updateBuyState();
    }, 1000);
  </script>
